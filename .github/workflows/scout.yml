name: Product Opportunity Scout

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      skip_trends:
        description: "Skip Google Trends (it rate-limits unauthenticated callers)"
        type: boolean
        default: false
      skip_appstore:
        description: "Skip app-store review collection"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: product-opportunity-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Run the scout
        run: |
          python -m scout \
            ${{ inputs.skip_trends && '--skip-trends' || '' }} \
            ${{ inputs.skip_appstore && '--skip-appstore' || '' }}

      - name: Publish the report to the job summary
        if: always()
        run: |
          if [ -f findings/latest.md ]; then
            head -c 900000 findings/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report was produced; see the job log." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the findings as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: findings-${{ github.run_id }}
          path: findings/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit the findings back to the repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain findings)" ]; then
            echo "No new findings to commit."
            exit 0
          fi

          git add findings
          git commit -m "scout: findings for $(date -u +%Y-%m-%d)"

          branch="${GITHUB_REF_NAME}"
          for delay in 0 2 4 8 16; do
            if [ "$delay" -ne 0 ]; then
              echo "Push failed; retrying in ${delay}s"
              sleep "$delay"
              git pull --rebase origin "$branch"
            fi
            if git push origin "HEAD:${branch}"; then
              echo "Pushed findings to ${branch}."
              exit 0
            fi
          done
          echo "Could not push the findings after 5 attempts." >&2
          exit 1
